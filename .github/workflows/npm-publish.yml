# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish secureprompt.dev

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm i -g npm@latest
      - run: npm --version
      - run: npm ci
      - run: npm run build
      - name: Check version change
        id: version_check
        run: |
          PKG_VERSION=$(node -p "require('./packages/secureprompt/package.json').version")
          PUBLISHED_VERSION=$(npm view secureprompt.dev version || echo "0.0.0")
          if [ "$PKG_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "publish=false" >> $GITHUB_OUTPUT
          else
            echo "publish=true" >> $GITHUB_OUTPUT
          fi
      - name: Publish
        if: steps.version_check.outputs.publish == 'true'
        run: npm publish -w secureprompt.dev --access public --provenance
        env:
          NODE_AUTH_TOKEN: ""
          
