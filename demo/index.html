<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SecurePrompt Sanitizer Demo</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; line-height: 1.4; }
      h1 { font-size: 1.25rem; margin: 0 0 1rem; }
      .row { display: flex; gap: 1rem; flex-wrap: wrap; }
      .col { flex: 1 1 420px; min-width: 320px; }
      textarea, input[type="text"] { width: 100%; padding: 0.75rem; font: inherit; }
      textarea { height: 160px; }
      button { padding: 0.6rem 1rem; font: inherit; cursor: pointer; }
      .controls { display: flex; align-items: center; gap: 0.75rem; margin: 0.75rem 0 1rem; }
      .muted { opacity: 0.8; font-size: 0.925rem; }
      .result { border: 1px solid #8884; border-radius: 8px; padding: 1rem; }
      .output { white-space: pre-wrap; word-break: break-word; background: #8881; padding: 0.75rem; border-radius: 6px; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.95em; }
      .kv { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 0.75rem; align-items: start; }
      .list { margin: 0.25rem 0 0; padding-left: 1rem; }
      .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.8rem; border: 1px solid #8886; }
    </style>
  </head>
  <body>
    <h1>SecurePrompt – Sanitizer Demo</h1>

    <div class="row">
      <div class="col">
        <label for="input"><strong>Input</strong></label>
        <textarea id="input" placeholder="Type text with potential sensitive data or prompt injection attempts..."></textarea>
        <div class="controls">
          <label for="action">Action:</label>
          <select id="action">
            <option value="redact" selected>redact</option>
            <option value="block">block</option>
            <option value="warn">warn</option>
          </select>
          <label><input id="details" type="checkbox" checked /> detailed results</label>
          <button id="run">Sanitize</button>
        </div>
        <p class="muted">Uses the local ESM build at <code>packages/secureprompt/dist/index.mjs</code>.</p>
      </div>

      <div class="col">
        <div class="result">
          <div class="kv">
            <div>Time</div>
            <div><span id="time">–</span></div>
            <div>Valid</div>
            <div><span id="valid">–</span></div>
            <div>Blocked</div>
            <div><span id="blocked">–</span></div>
            <div>Violations</div>
            <div><span id="violationCount">–</span></div>
          </div>
          <hr />
          <div>
            <strong>Sanitized Output</strong>
            <div id="output" class="output">–</div>
          </div>
          <div id="violationsWrap" style="margin-top: 0.75rem; display:none;">
            <strong>Violation Details</strong>
            <ol id="violations" class="list"></ol>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import { sanitizePrompt } from '../packages/secureprompt/dist/index.mjs';

      const $ = (id) => document.getElementById(id);
      const input = $('input');
      const actionSel = $('action');
      const details = $('details');
      const runBtn = $('run');
      const timeEl = $('time');
      const validEl = $('valid');
      const blockedEl = $('blocked');
      const outputEl = $('output');
      const violationCountEl = $('violationCount');
      const violationsWrap = $('violationsWrap');
      const violationsEl = $('violations');

      function formatMs(ms) {
        return `${ms.toFixed(2)} ms`;
      }

      function renderResult(res, elapsedMs) {
        timeEl.textContent = formatMs(elapsedMs);
        validEl.textContent = String(res.isValid);
        blockedEl.textContent = String(res.blocked);
        outputEl.textContent = res.sanitized;
        const count = res.violations?.length ?? 0;
        violationCountEl.textContent = String(count);

        if (count > 0) {
          violationsWrap.style.display = '';
          violationsEl.innerHTML = '';
          for (const v of res.violations) {
            const li = document.createElement('li');
            const header = document.createElement('div');
            const badge = document.createElement('span');
            const type = document.createElement('strong');
            const message = document.createElement('span');
            const range = document.createElement('div');
            const match = document.createElement('div');
            const matchCode = document.createElement('code');

            badge.className = 'badge';
            badge.textContent = v.severity;
            type.textContent = v.type;
            const messageText = v.context || v.message || '';
            message.textContent = messageText ? ` — ${messageText}` : '';
            header.append(badge, ' ', type, message);

            range.className = 'muted';
            range.textContent = `range: [${v.startIndex}, ${v.endIndex})`;

            match.className = 'muted';
            matchCode.textContent = v.matched || '';
            match.append('match: ', matchCode);

            li.append(header, range, match);
            violationsEl.append(li);
          }
        } else {
          violationsWrap.style.display = 'none';
          violationsEl.innerHTML = '';
        }
      }

      function runOnce() {
        const text = input.value;
        const cfg = {
          action: actionSel.value,
          detailedResults: details.checked,
        };
        const t0 = performance.now();
        const result = sanitizePrompt(text, cfg);
        const t1 = performance.now();
        renderResult(result, t1 - t0);
      }

      runBtn.addEventListener('click', runOnce);
      input.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'enter') {
          runOnce();
        }
      });
    </script>
  </body>
  </html>
